name: Build Armbian Image

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: '桌面环境'
        required: true
        type: choice
        options:
          - gnome
          - xfce
        default: gnome

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 定制仓库
        uses: actions/checkout@v4
        with:
          path: custom

      - name: 设置 QEMU（解决 arm64 跨架构构建）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: 克隆 Armbian 构建框架
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build

      - name: 合并 userpatches
        run: |
          mkdir -p armbian-build/userpatches
          if [ -d custom/userpatches ]; then
            cp -rv custom/userpatches/* armbian-build/userpatches/
          fi
          echo "=== userpatches 内容 ==="
          find armbian-build/userpatches -type f | sort

      - name: 修改内核配置（GT9XX 改 m，启用 GOODIX m）
        run: |
          CONFIG_FILE=armbian-build/config/kernel/linux-rk35xx-vendor.config
          echo "=== 修改前 ==="
          grep -E 'CONFIG_TOUCHSCREEN_(GT9XX|GOODIX)' "$CONFIG_FILE" || echo "(未找到相关项)"

          if grep -q '^CONFIG_TOUCHSCREEN_GT9XX=y' "$CONFIG_FILE"; then
            sed -i 's/^CONFIG_TOUCHSCREEN_GT9XX=y/CONFIG_TOUCHSCREEN_GT9XX=m/' "$CONFIG_FILE"
            echo "✅ GT9XX 已改为 m"
          elif grep -q '^CONFIG_TOUCHSCREEN_GT9XX=m' "$CONFIG_FILE"; then
            echo "ℹ️ GT9XX 已经是 m，跳过"
          else
            echo "⚠️ 未找到 CONFIG_TOUCHSCREEN_GT9XX"
          fi

          if grep -q '^CONFIG_TOUCHSCREEN_GOODIX=' "$CONFIG_FILE"; then
            sed -i 's/^CONFIG_TOUCHSCREEN_GOODIX=.*/CONFIG_TOUCHSCREEN_GOODIX=m/' "$CONFIG_FILE"
            echo "✅ GOODIX 已改为 m"
          else
            echo 'CONFIG_TOUCHSCREEN_GOODIX=m' >> "$CONFIG_FILE"
            echo "✅ GOODIX=m 已追加"
          fi

          echo "=== 修改后 ==="
          grep -E 'CONFIG_TOUCHSCREEN_(GT9XX|GOODIX)' "$CONFIG_FILE"

      - name: 编译 Armbian 镜像
        working-directory: armbian-build
        env:
          EXPERT: "yes"
        run: |
          ./compile.sh build \
            BOARD=orangepi5 \
            BRANCH=vendor \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_ENVIRONMENT=${{ inputs.desktop }} \
            DESKTOP_TIER=mid \
            KERNEL_CONFIGURE=no \
            RELEASE=resolute \
            COMPRESS_OUTPUTIMAGE=sha,img,xz

      - name: 展示编译产物
        working-directory: armbian-build
        run: |
          echo "=== output/images 内容 ==="
          ls -lh output/images/ || true

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-orangepi5-${{ inputs.desktop }}
          path: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha
            armbian-build/output/images/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Armbian orangepi5 ${{ inputs.desktop }} #${{ github.run_number }}
          body: |
            Armbian for Orange Pi 5, ${{ inputs.desktop }} desktop, WKS50HD005-WCT LCD 支持。

            ## 刷写

            下载 `.img.xz`，用 balenaEtcher 直接打开写入 SD 卡，或：

            ```bash
            xz -d Armbian-*.img.xz
            sudo dd if=Armbian-*.img of=/dev/sdX bs=4M status=progress
            ```
          files: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha
            armbian-build/output/images/*.txt
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
